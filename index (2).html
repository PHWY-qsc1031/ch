
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>浙大校史馆时空冒险</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "PingFang SC", "Microsoft Yahei", sans-serif;
  }

  :root {
    --zju-deep: #582078;
    --zju-main: #612784;
    --zju-light: #7b3ca0;
    --zju-pale: #efe9f5;
    --gold: #c9a848;
    --gold-light: #e6d499;
    --text-main: #222;
    --glass: rgba(255, 255, 255, 0.78);
    --glass-border: rgba(255, 255, 255, 0.85);
  }

  body {
    background: linear-gradient(135deg, #fcfaff, #f5f0fc, #f0e8f8);
    color: var(--text-main);
    height: 100vh;
    overflow: hidden;
  }

  .container {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
  }

  /* 背景层：每个场景一张照片 */
  .bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transition: opacity 0.45s ease;
    z-index: 1;
  }

  .bg.show {
    opacity: 1;
  }

  .bg-museum {
    background-image: url("https://www.zju.edu.cn/_upload/article/images/0f/52/1350732008414034420.jpg");
  }

  .bg-west {
    background-image: url("https://www.zju.edu.cn/_upload/article/images/90/74/4234871401321044301.jpg");
  }

  .bg-zhu {
    background-image: url("https://www.zju.edu.cn/_upload/article/images/1d/94/7431020411404034471.jpg");
  }

  .bg-wang {
    background-image: url("https://acv.zju.edu.cn/_upload/article/images/20/8e/3024401340040021440.jpg");
  }

  .bg-cheng {
    background-image: url("https://acv.zju.edu.cn/_upload/article/images/82/31/8401230040013044217.jpg");
  }

  .bg-old {
    background-image: url("https://www.zju.edu.cn/_upload/article/images/1d/94/7431020411404034471.jpg");
  }

  .bg-new {
    background-image: url("https://www.zju.edu.cn/_upload/article/images/7d/24/2041340101142044473.jpg");
  }

  .bg-mask {
    position: absolute;
    inset: 0;
    background: rgba(20, 10, 30, 0.38);
    z-index: 2;
  }

  /* 穿越转场 */
  .transition-layer {
    position: absolute;
    inset: 0;
    background: #000;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }

  .transition-layer.active {
    pointer-events: auto;
    animation: warp 1.8s ease-in-out forwards;
  }

  @keyframes warp {
    0% { opacity: 0; }
    20% { opacity: 1; }
    40% { opacity: 1; box-shadow: inset 0 0 160px var(--gold-light); }
    60% { opacity: 0.9; }
    100% { opacity: 0; }
  }

  .warp-text {
    color: #fff;
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 8px;
    margin-bottom: 16px;
  }

  .warp-ring {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 3px solid var(--gold-light);
    border-top-color: transparent;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* 换装面板：最前面 */
  .dressup-panel {
    position: absolute;
    inset: 0;
    background: linear-gradient(140deg, #582078dd, #3c1454dd);
    z-index: 150;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .dressup-panel.hidden {
    display: none;
  }

  .dressup-wrap {
    width: 100%;
    max-width: 840px;
    background: var(--glass);
    backdrop-filter: blur(14px);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 32px;
    box-shadow: 0 12px 45px #00000025;
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 28px;
  }

  .dressup-title {
    grid-column: 1 / -1;
    text-align: center;
    font-size: 26px;
    font-weight: bold;
    color: var(--zju-deep);
  }

  .player-view {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .player-port {
    width: 260px;
    height: 360px;
    border-radius: 18px;
    background: #e9e2f0;
    box-shadow: 0 8px 24px #00000018;
    overflow: hidden;
    position: relative;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #612784;
    font-weight: bold;
  }

  .breath {
    animation: breath 4s infinite ease-in-out;
  }

  @keyframes breath {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.025); }
  }

  .dressup-slot-group {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .slot-title {
    font-size: 16px;
    color: var(--zju-deep);
    font-weight: 600;
    margin-bottom: 8px;
  }

  .opt-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .cloth-opt {
    width: 76px;
    height: 76px;
    border-radius: 12px;
    border: 2px solid transparent;
    background: #f4f0f8;
    cursor: pointer;
    transition: 0.25s;
    box-shadow: 0 3px 10px #00000010;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    text-align: center;
    color: #582078;
  }

  .cloth-opt:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 16px #61278435;
  }

  .cloth-opt.active {
    border-color: var(--gold);
    background: #efe4d0;
  }

  .dressup-confirm {
    grid-column: 1 / -1;
    text-align: center;
    margin-top: 10px;
  }

  .btn-main {
    padding: 14px 32px;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 600;
    background: linear-gradient(135deg, var(--zju-main), var(--zju-light));
    color: #fff;
    cursor: pointer;
    transition: 0.25s;
  }

  .btn-main.btn-gold {
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: #3b2c0f;
  }

  .btn-main:hover {
    transform: translateY(-2px);
  }

  .btn-secondary {
    padding: 11px 20px;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    background: var(--glass);
    color: var(--zju-main);
    border: 1px solid #dccfe8;
    cursor: pointer;
  }

  .btn-secondary:hover {
    background: var(--zju-pale);
  }

  /* 展厅文物 */
  #artifactRoom {
    position: absolute;
    inset: 0;
    z-index: 5;
  }

  #artifactRoom.hidden {
    display: none;
  }

  .artifact {
    position: absolute;
    width: 140px;
    height: 140px;
    cursor: pointer;
    border-radius: 16px;
    transform: scale(1);
    transition: 0.35s;
    box-shadow: 0 6px 22px #00000018;
    overflow: hidden;
    border: 2px solid transparent;
    background: #fff;
  }

  .artifact img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .artifact:hover {
    transform: scale(1.09);
    border-color: var(--gold);
  }

  .artifact-tip {
    position: absolute;
    bottom: -30px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 13px;
    color: #fff;
    text-shadow: 0 2px 6px #00000080;
    white-space: nowrap;
    font-weight: 600;
  }

  /* NPC立绘：照片剪切 */
  .portrait {
    position: absolute;
    right: 6%;
    top: 14%;
    width: 200px;
    height: 340px;
    opacity: 0;
    transform: translateX(24px);
    transition: all 0.6s ease;
    pointer-events: none;
    background: #e9e2f0;
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 6;
  }

  .portrait img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .portrait.show {
    opacity: 1;
    transform: translateX(0);
  }

  /* 对话框 */
  .dialog-box {
    position: absolute;
    left: 5%;
    right: 5%;
    bottom: 4%;
    background: var(--glass);
    backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 22px 26px;
    z-index: 10;
    max-height: 42vh;
    overflow-y: auto;
  }

  .name-bar {
    color: var(--zju-deep);
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 10px;
  }

  .dialog-text {
    font-size: 16px;
    line-height: 1.8;
    color: #222;
  }

  .choice-group {
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .choice-btn {
    width: 100%;
    background: rgba(255, 255, 255, 0.55);
    border: 1px solid #dccfe8;
    color: var(--zju-deep);
    text-align: left;
    padding: 12px 18px;
    border-radius: 12px;
    font-size: 15px;
    cursor: pointer;
    transition: 0.25s;
  }

  .choice-btn:hover {
    background: var(--zju-pale);
    transform: translateX(4px);
  }

  .top-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: 14px 22px;
    background: var(--glass);
    z-index: 20;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .top-bar.hidden {
    display: none;
  }

  .info {
    font-size: 14px;
    color: #fff;
    text-shadow: 0 1px 4px #00000080;
    margin: 0 6px;
  }

  .qiu-shi {
    color: var(--gold-light);
    font-weight: bold;
  }

  .ctrl-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .chapter-tip {
    position: absolute;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(135deg, #612784, #7b3ca0);
    color: #fff;
    padding: 8px 22px;
    border-radius: 32px;
    font-size: 14px;
    opacity: 0;
    transition: 0.6s;
    z-index: 25;
  }

  .chapter-tip.show {
    opacity: 1;
  }

  .hide {
    display: none !important;
  }
</style>
</head>

<body>
  <div class="container">
    <!-- 背景照片层 -->
    <div class="bg bg-museum show" id="bgMuseum"></div>
    <div class="bg bg-west" id="bgWest"></div>
    <div class="bg bg-zhu" id="bgZhu"></div>
    <div class="bg bg-wang" id="bgWang"></div>
    <div class="bg bg-cheng" id="bgCheng"></div>
    <div class="bg bg-old" id="bgOld"></div>
    <div class="bg bg-new" id="bgNew"></div>

    <div class="bg-mask"></div>

    <!-- 穿越转场 -->
    <div class="transition-layer" id="warpLayer">
      <div class="warp-text">时空穿梭中……</div>
      <div class="warp-ring"></div>
    </div>

    <!-- 换装面板：最前面 -->
    <div class="dressup-panel" id="dressupPanel">
      <div class="dressup-wrap">
        <div class="dressup-title">✨ 你的形象 · 人文社科实验班新生</div>
        <div class="player-view">
          <div class="player-port breath" id="playerPort">
            主角立绘<br />浙大校服
          </div>
          <div style="color:#582078;font-weight:600">当前穿搭：浙大校服</div>
        </div>
        <div class="dressup-slot-group">
          <div>
            <div class="slot-title">🎽 上衣</div>
            <div class="opt-row">
              <div class="cloth-opt active" data-type="top" data-name="浙大校服">校服</div>
              <div class="cloth-opt" data-type="top" data-name="简约衬衫">衬衫</div>
              <div class="cloth-opt" data-type="top" data-name="针织毛衣">毛衣</div>
            </div>
          </div>
          <div>
            <div class="slot-title">🎒 配饰</div>
            <div class="opt-row">
              <div class="cloth-opt active" data-type="acc" data-name="无配饰">无</div>
              <div class="cloth-opt" data-type="acc" data-name="帆布包">帆布包</div>
            </div>
          </div>
          <div>
            <div class="slot-title">✨ 风格</div>
            <div class="opt-row">
              <div class="cloth-opt active" data-type="style" data-name="清爽学生">清爽</div>
              <div class="cloth-opt" data-type="style" data-name="文雅书卷">书卷</div>
            </div>
          </div>
        </div>
        <div class="dressup-confirm">
          <button class="btn-main btn-gold" onclick="confirmDress()">确认形象，出发前往浙大校史馆</button>
        </div>
      </div>
    </div>

    <!-- 校史馆展厅 -->
    <div id="artifactRoom" class="hide">
      <div class="artifact" style="top:18%;left:12%" onclick="startWarp('west')">
        <img src="https://images.unsplash.com/photo-1519452575472-5c19be42941f?auto=format&fit=crop&w=400&q=80" alt="西迁旧课本" />
        <div class="artifact-tip">西迁求学旧课本</div>
      </div>

      <div class="artifact" style="top:22%;right:15%" onclick="startWarp('zhu')">
        <img src="https://images.unsplash.com/photo-1455390582262-044cdead277a?auto=format&fit=crop&w=400&q=80" alt="竺可桢日记" />
        <div class="artifact-tip">竺可桢校长手稿日记</div>
      </div>

      <div class="artifact" style="top:50%;left:8%" onclick="startWarp('wang')">
        <img src="https://images.unsplash.com/photo-1532187863486-abf9dbad1b69?auto=format&fit=crop&w=400&q=80" alt="王淦昌手稿" />
        <div class="artifact-tip">王淦昌科研手稿</div>
      </div>

      <div class="artifact" style="top:55%;right:12%" onclick="startWarp('cheng')">
        <img src="https://images.unsplash.com/photo-1517976487492-5750f31959f4?auto=format&fit=crop&w=400&q=80" alt="两弹一星功勋章" />
        <div class="artifact-tip">两弹一星功勋纪念章</div>
      </div>

      <div class="artifact" style="bottom:18%;left:20%" onclick="startWarp('old')">
        <img src="https://images.unsplash.com/photo-1578662996442-48f60103fc96?auto=format&fit=crop&w=400&q=80" alt="民国老校徽" />
        <div class="artifact-tip">民国浙大老校徽</div>
      </div>

      <div class="artifact" style="bottom:22%;right:18%" onclick="startWarp('new')">
        <img src="https://images.unsplash.com/photo-1562774053-701939374585?auto=format&fit=crop&w=400&q=80" alt="新时代科创展品" />
        <div class="artifact-tip">新时代科创展品</div>
      </div>
    </div>

    <div class="chapter-tip" id="chapterTip"></div>

    <!-- NPC立绘：人物照片 -->
    <div class="portrait" id="portrait">
      <img id="npcImg" src="" alt="NPC立绘" />
    </div>

    <div class="top-bar" id="topBar" class="hidden">
      <div class="info">探索进度：<span id="stageName">校史馆主展厅</span></div>
      <div class="info">求是传承值：<span class="qiu-shi" id="qsVal">0</span></div>
      <div class="ctrl-group">
        <button class="btn-secondary" onclick="backMuseum()">返回展厅</button>
        <button class="btn-secondary" onclick="restartGame()">重新开始</button>
      </div>
    </div>

    <div class="dialog-box" id="dialogBox" class="hide">
      <div class="name-bar"><span id="speaker">——</span></div>
      <div class="dialog-text" id="dialogText"></div>
      <div class="choice-group" id="choiceGroup"></div>
    </div>
  </div>

<script>
  let qsScore = 0;
  let currentScene = "museum";
  let outfit = { top: "浙大校服", acc: "无配饰", style: "清爽学生" };

  // 人物照片：竺可桢、王淦昌
  const npcImages = {
    zhu: "https://bkimg.cdn.bcebos.com/smart/from16102000/041373f082025aafd056250ef3edab64034f1a77",
    wang: "https://bkimg.cdn.bcebos.com/smart/from16102000/9213b07eca806538dc66ef999adda144ad348266"
  };

  // 场景配置：每个场景都绑定浙大真实照片背景
  const sceneData = {
    museum: {
      name: "校史馆主展厅",
      bgId: "bgMuseum",
      npc: "校史馆讲解员",
      npcImg: "",
      opening: {
        text: "欢迎来到浙大校史馆！眼前六件展品，每一件都连通一段求是往事。触碰展品，你就能穿越回对应的时光。我建议你先从西迁旧课本开始，那里藏着浙大最艰难也最动人的一段记忆。",
        choices: [
          { text: "好，我先去看看西迁旧课本", next: "warpWest" },
          { text: "我想先了解竺可桢校长的故事", next: "warpZhu" },
          { text: "为什么校史馆里会有科研手稿？", next: "talk1" }
        ]
      },
      talk1: {
        text: "因为浙大从来不是只读书的地方。从竺可桢校长到王淦昌先生，再到两弹一星功勋人物，浙大人一直在用知识回应国家的需要。",
        choices: [
          { text: "这和我理解的大学不太一样", next: "talk2" },
          { text: "所以求是精神也包括为国担当？", next: "talk3" }
        ]
      },
      talk2: {
        text: "很多人以为大学只是学习专业知识，但浙大的传统里，知识始终和家国联系在一起。读书不是为了独善其身，而是为了看清时代，承担责任。",
        choices: [
          { text: "那我该怎么开始理解这份责任？", next: "talk4" },
          { text: "我还是先去看展品吧", next: "end" }
        ]
      },
      talk3: {
        text: "当然。求是不仅是求真，也是担当。求真让你明白世界是什么样，担当让你思考自己应该做什么。",
        choices: [
          { text: "这两个问题听起来很重要", next: "talk5" },
          { text: "我去西迁时空里找找答案", next: "warpWest" }
        ]
      },
      talk4: {
        text: "从参观校史馆开始，从认真听每一段故事开始，从问问自己为什么来到这里开始。答案不是一下子出现的，但路会越走越清楚。",
        choices: [
          { text: "我会从一件件展品开始看起", next: "end" },
          { text: "谢谢您的提醒", next: "end" }
        ]
      },
      talk5: {
        text: "对，到浙大来做什么？将来毕业后要做什么样的人？这两个问题会陪你很久。",
        choices: [
          { text: "我想去见见竺可桢校长", next: "warpZhu" },
          { text: "我先去西迁的时空看看", next: "warpWest" }
        ]
      },
      warpWest: { next: "warp", target: "west" },
      warpZhu: { next: "warp", target: "zhu" }
    },

    west: {
      name: "西迁岁月",
      bgId: "bgWest",
      npc: "西迁浙大学子",
      npcImg: "",
      opening: {
        text: "你终于来了。这里不是今天的浙大，而是战火中的浙大。我们刚刚走完一段山路，课本还背在包袱里，前面还不知道能不能平安开课。",
        choices: [
          { text: "你们为什么一定要继续办学？", next: "w1" },
          { text: "一路上最困难的是什么？", next: "w2" },
          { text: "我是来听你们故事的", next: "w3" }
        ]
      },
      w1: {
        text: "因为学校不能倒。敌人想打断我们的文脉，想让年轻人失去读书的机会。我们偏不，只要还能走，就继续上课；只要还有书声，国家就还有希望。",
        choices: [
          { text: "这就是文军长征吗？", next: "w4" },
          { text: "你们不怕牺牲吗？", next: "w5" }
        ]
      },
      w2: {
        text: "怕。但更怕的是没有未来。我们走过很多路，住过破庙，吃过粗粮，有时候连灯油都不够。可先生们仍然讲课，学生们仍然记笔记。",
        choices: [
          { text: "这样的环境怎么安心学习？", next: "w6" },
          { text: "大家靠什么坚持下来？", next: "w7" }
        ]
      },
      w3: {

  // 换装选择
  document.querySelectorAll(".cloth-opt").forEach(el => {
    el.onclick = function () {
      document.querySelectorAll(`.cloth-opt[data-type="${this.dataset.type}"]`).forEach(i => i.classList.remove("active"));
      this.classList.add("active");
      outfit[this.dataset.type] = this.dataset.name;
      document.querySelector("#playerPort").innerText = `主角立绘\n${outfit.top}\n${outfit.acc}\n${outfit.style}`;
    };
  });

  // 确认换装：进入游戏主流程
  function confirmDress() {
    document.getElementById("dressupPanel").classList.add("hidden");
    document.getElementById("artifactRoom").classList.remove("hide");
    document.getElementById("topBar").classList.remove("hidden");
    changeScene("museum");
  }

  // 穿越触发
  function startWarp(targetSceneId) {
    const warp = document.getElementById("warpLayer");
    warp.classList.add("active");

    setTimeout(() => {
      warp.classList.remove("active");
      changeScene(targetSceneId);
    }, 1800);
  }

  // 切换场景：隐藏文物 + 切换浙大真实照片背景
  function changeScene(sceneId) {
    currentScene = sceneId;
    const s = sceneData[sceneId];

    if (sceneId === "museum") {
      document.getElementById("artifactRoom").classList.remove("hidden");
    } else {
      document.getElementById("artifactRoom").classList.add("hidden");
    }

    document.querySelectorAll(".bg").forEach(bg => bg.classList.remove("show"));
    document.getElementById(s.bgId).classList.add("show");

    document.getElementById("stageName").innerText = s.name;
    showTip("来到：" + s.name);
    showDialog(s.npc, s.opening);
    document.getElementById("portrait").classList.add("show");
  }

  function backMuseum() {
    changeScene("museum");
  }

  function showTip(txt) {
    const tip = document.getElementById("chapterTip");
    tip.innerText = txt;
    tip.classList.add("show");
    setTimeout(() => tip.classList.remove("show"), 1800);
  }

  // 交互式对话：支持十句以上和选项分支
  function showDialog(speaker, node) {
    const box = document.getElementById("dialogBox");
    const nameDom = document.getElementById("speaker");
    const textDom = document.getElementById("dialogText");
    const choiceWrap = document.getElementById("choiceGroup");
    const npcImg = document.getElementById("npcImg");

    box.classList.remove("hide");
    nameDom.innerText = speaker;
    textDom.innerText = node.text;
    choiceWrap.innerHTML = "";

    // 显示对应 NPC 照片立绘
    if (sceneData[currentScene].npcImg) {
      npcImg.src = sceneData[currentScene].npcImg;
      npcImg.style.display = "block";
    } else {
      npcImg.style.display = "none";
    }

    node.choices.forEach(ch => {
      const btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.innerText = ch.text;
      btn.onclick = () => {
        if (ch.addScore) {
          qsScore += ch.addScore;
          document.getElementById("qsVal").innerText = qsScore;
        }

        if (ch.next === "back") {
          backMuseum();
          return;
        }
        if (ch.next === "end") {
          box.classList.add("hide");
          return;
        }
        if (ch.next === "warp") {
          startWarp(ch.target);
          return;
        }

        const nextNode = sceneData[currentScene][ch.next];
        showDialog(speaker, nextNode);
      };
      choiceWrap.appendChild(btn);
    });
  }

  function restartGame() {
    qsScore = 0;
    document.getElementById("qsVal").innerText = 0;
    document.getElementById("artifactRoom").classList.remove("hidden");
    document.getElementById("artifactRoom").classList.remove("hide");
    document.getElementById("topBar").classList.add("hidden");
    document.getElementById("dialogBox").classList.add("hide");
    document.getElementById("portrait").classList.remove("show");
    document.getElementById("dressupPanel").classList.remove("hidden");
  }
</script>
